<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The app's header mark: a calendar on the slate-900 tile, with one day
    filled blue the way the grid highlights today. Kept to a few large shapes
    so it still reads at 16px in a browser tab.
  -->
  <rect width="32" height="32" rx="7" fill="#0f172a" />
  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
    <path d="M12 5.5v4M20 5.5v4" />
    <rect x="7" y="8" width="18" height="17" rx="3" />
    <path d="M7 14h18" />
  </g>
  <rect x="10" y="17" width="5" height="5" rx="1.2" fill="#3b82f6" />
  <rect x="17" y="17" width="5" height="5" rx="1.2" fill="#ffffff" opacity="0.35" />
</svg>
